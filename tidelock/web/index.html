<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tidelock">
<meta name="theme-color" content="#05070b">
<meta name="description" content="TIDELOCK — fly real orbits, trade across a living frontier, and tip the balance of power in the Ember Reach.">
<title>TIDELOCK</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: #05070b; overflow: hidden; overscroll-behavior: none; }
  body { position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; -webkit-text-size-adjust: 100%; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #8fa3b8; font: 500 12px/1.6 -apple-system, "SF Pro Text", system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="boot">Tidelock</div>
<script>
  // Last-resort message if the game script itself fails to load or parse (the in-game error panel takes over once it runs).
  window.addEventListener('error', function (e) {
    if (window.__tlErr) return;
    var b = document.getElementById('boot');
    if (b) { b.style.letterSpacing = '0'; b.style.textTransform = 'none'; b.style.color = '#FF5A4D'; b.textContent = 'TIDELOCK could not start: ' + (e && e.message ? e.message : 'script error'); }
  });
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
